name: Deploy prototype naar GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Controle publieke sleutel
        run: test -n "${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}" || (echo "Repository-variabele VITE_SUPABASE_PUBLISHABLE_KEY ontbreekt" && exit 1)
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          # Publieke (publishable) sleutel van Supabase V2, als repository-
          # variabele (Settings → Secrets and variables → Actions → Variables).
          # Nooit een service_role-sleutel.
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
